  fields:
    condition: rank-eq-gold
    index: 3
    text: "**Your music recognition is stronger than most!**"
    text_zh_hans: "**你的音乐识别表现优于大多数人！**"
- model: action.finalfeedback
  fields:
    final: tunetwins-final
    feedback_text: 66
- model: action.condition
  fields:
    metric: rank
    operator: eq
    value: silver
- model: action.feedbacktext
  pk: 67
  fields:
    condition: rank-eq-silver
    index: 4
    text: "**Your music recognition is above average — well done!**"
    text_zh_hans: "**你的音乐识别表现良好，高于平均水平！**"
    alternative_text: "**Your music recognition has room to grow — and that's completely normal when listening to unfamiliar music!**"
    alternative_text_zh_hans: "**发展级\t您的音乐识别表现还有成长空间，这在不熟悉音乐的情况下完全正常！**"
- model: action.finalfeedback
  fields:
    final: tunetwins-final
    feedback_text: 67
- model: action.condition
  fields:
    metric: strongest_domain
    operator: eq
    value: spectral
- model: action.feedbacktext
  pk: 68
  fields:
    condition: strongest_domain-eq-spectral
    index: 5
    text: "*In addition, your pitch recognition performance is stronger than your rhythm recognition performance — that's the most common pattern we see!*"
    text_zh_hans: "*此外，您的音调识别表现优于节奏识别表现，这与大部分参与者的识别模式相一致。*"
- model: action.finalfeedback
  fields:
    final: tunetwins-final
    feedback_text: 68
- model: action.condition
  fields:
    metric: strongest_domain
    operator: eq
    value: temporal
- model: action.feedbacktext
  pk: 69
  fields:
    condition: strongest_domain-eq-temporal
    index: 6
    text: "*In addition, your rhythm recognition performance is stronger than your pitch recognition performance — that's less common, and suggests you have a unique way of processing music!*"
    text_zh_hans: "*此外，您的节奏识别表现优于音调识别表现，这与大部分参与者的识别模式不同，您在聆听和加工音乐信号方面很特别哦！*"
    alternative_text: "*In addition, your pitch and rhythm recognition performance is equally balanced — a rare and well-rounded profile!*"
    alternative_text_zh_hans: "*此外，您的音调识别表现和节奏识别表现旗鼓相当——这是非常少见且均衡的识别模式！*"
- model: action.finalfeedback
  fields:
    final: tunetwins-final
    feedback_text: 69
